---
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_psk
  min_auth_mode: WPA2

  # Enable full scan on startup
  fast_connect: false

  # Disable power save
  power_save_mode: none

  # Reboot if no WiFi connection after 2 minutes
  reboot_timeout: 2min

  # Enable 802.11k/v roaming (ESP32)
  enable_btm: true
  enable_rrm: true
